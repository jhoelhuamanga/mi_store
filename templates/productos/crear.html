{% extends 'plantilla.html' %}
{% block content %}
<div class="card mt-4 col-md-8 mx-auto">
    <div class="card-header bg-info text-white">
        <h4 class="mb-0">AGREGAR NUEVO PRODUCTO</h4>
    </div>
    <div class="card-body">
        <h5 class="card-title">Datos del producto</h5>
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre:</label>
                {{ form.nombre }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.descripcion.id_for_label }}" class="form-label">Descripción:</label>
                {{ form.descripcion }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.precio.id_for_label }}" class="form-label">Precio:</label>
                {{ form.precio }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.stock.id_for_label }}" class="form-label">Stock:</label>
                {{ form.stock }}
            </div>
            
            <div class="mb-3 form-check">
                {{ form.disponible }}
                <label for="{{ form.disponible.id_for_label }}" class="form-check-label">Disponible</label>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a href="{% url 'listar_productos' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
