{% extends 'plantilla.html' %}
{% block content %}
<div class="card mt-4 col-md-10 mx-auto border-0 shadow-sm">
    <div class="card-header bg-info text-white fw-bold">
        EDITAR PRODUCTO
    </div>
    <div class="card-body p-4">
        <h4 class="card-title mb-4">Datos del producto</h4>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="{{ form.nombre.id_for_label }}" class="form-label fw-bold">Nombre del producto:</label>
                {{ form.nombre }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.descripcion.id_for_label }}" class="form-label fw-bold">Descripción:</label>
                {{ form.descripcion }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.precio.id_for_label }}" class="form-label fw-bold">Precio:</label>
                {{ form.precio }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.stock.id_for_label }}" class="form-label fw-bold">Stock:</label>
                {{ form.stock }}
            </div>
            
            <div class="mb-3 form-check mt-3">
                {{ form.disponible }}
                <label for="{{ form.disponible.id_for_label }}" class="form-check-label fw-bold">Disponible</label>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-success">Actualizar</button>
                <a href="{% url 'listar_productos' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
