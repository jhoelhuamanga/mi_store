{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} {% endblock title %}</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" />
    
    <!-- FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Tu CSS del Sidebar -->
    <link type="text/css" rel="stylesheet" href="{% static 'css/sidebar.css' %}" />
</head>
<body>
    <!-- El sidebar -->
    {% include 'pages/sidebar.html' %}
    
    <!-- La barra de navegación superior -->
    {% include 'pages/navbar.html' %}
    
    <!-- El contenido principal -->
    <main class="main-content" style="margin-top: 70px;"> <!-- Margen superior para que el navbar no lo tape -->
        <div class="container-fluid">
            {% block content %} {% endblock content %}
        </div>
    </main>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
